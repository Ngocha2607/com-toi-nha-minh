<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cơm Tối Nhà Mình</title>
<meta name="description" content="Bấm một lần để chọn thực đơn bữa tối 4 món cho 3 người lớn, từ 100 thực đơn có nguyên liệu và cách nấu.">
<meta name="theme-color" content="#1F5C3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cơm Tối">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="logo" src="icons/logo.svg" alt="" width="36" height="36">
    <div class="brand"><b>Cơm Tối</b><small>Nhà mình · 3 người lớn</small></div>
    <span class="pill" id="comboPill">Số –</span>
  </header>

  <main>
    <!-- Tab Hôm nay -->
    <section class="view" id="view-today" aria-label="Thực đơn tối nay">
      <div class="install" id="installTip" hidden>
        <div><b>Cài lên màn hình chính</b><span id="installText"></span></div>
        <button type="button" class="install-btn" id="installBtn" hidden>Cài app</button>
        <button type="button" class="x" id="installClose" aria-label="Ẩn gợi ý">×</button>
      </div>
      <div class="hello">
        <p class="date" id="dateLine"></p>
        <h1>Tối nay ăn <span>gì?</span></h1>
      </div>
      <div class="chips" id="nutri" aria-label="Các nhóm chất"></div>
      <div class="dishes" id="menu"></div>
      <p class="note">Ăn kèm cơm trắng, khoảng 300g gạo cho 3 người. Ảnh mang tính tham khảo.</p>
    </section>

    <!-- Tab Đi chợ -->
    <section class="view" id="view-market" aria-label="Danh sách đi chợ" hidden>
      <div class="hello">
        <p class="date" id="marketSub"></p>
        <h1>Đi <span>chợ</span></h1>
      </div>
      <div class="market-tools">
        <span id="marketCount"></span>
        <button type="button" class="link" id="uncheckBtn">Bỏ đánh dấu</button>
      </div>
      <div id="market"></div>
      <button type="button" class="wide" id="copyBtn">Chép danh sách để gửi Zalo</button>
      <textarea id="copyFallback" hidden readonly aria-label="Danh sách đi chợ"></textarea>
    </section>

    <!-- Tab Thực đơn -->
    <section class="view" id="view-all" aria-label="Cả 100 thực đơn" hidden>
      <div class="hello">
        <p class="date">Chạm vào một thực đơn để chọn</p>
        <h1>100 <span>thực đơn</span></h1>
      </div>
      <input id="search" type="search" placeholder="Tìm món: cá, rau muống, canh chua…" aria-label="Tìm thực đơn theo tên món" autocomplete="off">
      <div class="list" id="list"></div>
      <p class="note">Ảnh món ăn từ <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a>, tên tác giả ghi trên từng ảnh.</p>
    </section>
  </main>

  <button class="fab" id="pickBtn" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/></svg>
    <span id="pickLabel">Chọn món khác</span>
  </button>

  <nav class="tabbar" aria-label="Chuyển trang">
    <button type="button" class="tab on" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18c0 4.5-3.6 8-9 8s-9-3.5-9-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8c-1-1.3 1-2.2 0-3.6M13 8c-1-1.3 1-2.2 0-3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Hôm nay</span>
    </button>
    <button type="button" class="tab" data-tab="market">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.3 11.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Đi chợ</span>
    </button>
    <button type="button" class="tab" data-tab="all">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Thực đơn</span>
    </button>
  </nav>

  <!-- Trang chi tiết món -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-bar">
      <button type="button" class="back" id="sheetBack" aria-label="Quay lại">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="sheetKind"></span>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/photos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
